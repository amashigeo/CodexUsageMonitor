<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Codex 用量仪表盘</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><span class="eyebrow">CODEX · LOCAL MONITOR</span><h1>用量仪表盘<span class="dot"></span></h1><p>掌握消耗节奏，留出思考空间。</p></div><button id="refresh">立即刷新</button></header><div class="status" id="status">正在读取本地统计…</div><div id="buckets"></div><section class="tokens"><div class="section-title"><h2>Token 活动</h2><select id="range"><option value="today">今天</option><option value="week">近 7 天</option><option value="session">最近活跃会话</option></select></div><div class="grid stats" id="tokens"></div><div class="speed"><div><small>输出 token 速度 · 近 60 秒均值</small><strong id="outputSpeed">—</strong></div><div><small>全部 token 吞吐 · 近 60 秒均值</small><strong id="totalSpeed">—</strong></div></div></section><footer>只读本机 Codex 会话日志 · 每 5 秒更新<br>Token 统计仅覆盖本机保留的日志；缓存输入包含在输入内，推理包含在输出内。速度包含等待和工具耗时，并非模型实时生成速度。额度预计耗尽时间使用近 1 小时同一窗口样本线性估算，不代表保证可用时长。<span id="scan"></span></footer></main><script src="/app.js"></script></body></html>
