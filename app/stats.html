<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex · 扩展统计</title><link rel="stylesheet" href="/stats.css"></head><body><main><header><div class="brand"><img src="/mascot-title.png" alt="白龙娘"><div><div class="eyebrow">CODEX / INSIGHTS</div><h1>让每一次思考，都有迹可循</h1></div></div><button id="refresh">刷新</button></header><p id="status" class="muted">正在读取本机记录…</p><nav id="periods" aria-label="统计范围"></nav><section><div class="section-head"><div><h2>每日用量</h2><p class="muted">颜色越深，当天使用越多。点击方块查看 token 与美元金额。</p></div><div class="filters"><select id="archiveYear" aria-label="用量年份"></select><select id="heatMetric" aria-label="方块颜色依据"><option value="total_tokens">按 token</option><option value="estimated_usd">按金额</option></select></div></div><div class="heat-scroll"><div id="months"></div><div class="heat-layout"><div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="heatmap" aria-label="每日用量日历"></div></div></div><div class="heat-footer"><span id="dayDetail">选择一天查看用量</span><span class="legend">少 <i class="level0"></i><i class="level1"></i><i class="level2"></i><i class="level3"></i><i class="level4"></i> 多</span></div></section><section><div class="section-head"><div><h2 id="sessionsTitle">会话花费</h2><p class="muted">按当前所选时间范围统计每个会话。</p></div><div class="filters"><input id="search" placeholder="搜索会话" aria-label="搜索会话"><select id="sort" aria-label="排序"><option value="cost">金额从高到低</option><option value="tokens">Token 从高到低</option></select></div></div><div class="table-scroll"><table><thead><tr><th>会话</th><th>输入</th><th>缓存命中</th><th>输出</th><th>总 token</th><th>API 金额</th></tr></thead><tbody id="sessions"></tbody></table></div><p class="muted" id="coverage"></p></section><footer>已读取的用量保存在本机，原日志清理后仍可查看。首次存档前已经缺失的记录无法补算。<br>本周从周一开始；日期按电脑本地时区。美元按 API 单价折算，非实际账单。默认每 15 秒更新。</footer></main><script src="/stats.js"></script></body></html>
